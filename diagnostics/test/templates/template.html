<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scheduler Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .card-kpi { min-height: 122px; }
    .stat { font-size: clamp(1.25rem, 2vw, 1.7rem); font-weight: 700; }
    .spark { height: 42px; }
    .table-responsive { max-height: 420px; }
    .search-input { max-width: 260px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg border-bottom sticky-top bg-body">
    <div class="container-fluid">
      <a class="navbar-brand fw-semibold" href="#">⚙️ Scheduler Dashboard</a>
      <div class="d-flex gap-2 ms-auto align-items-center">
        <input id="q" class="form-control form-control-sm search-input" placeholder="Filter tasks…" />
        <button class="btn btn-sm btn-outline-secondary" id="refresh">Refresh</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <!-- KPI cards -->
    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="card card-kpi shadow-sm">
          <div class="card-body">
            <div class="text-secondary small">Task Arival Rate</div>
            <div class="stat" id="kpi-arrival">—</div>
            <canvas id="spark-arrival" class="spark"></canvas>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-4">
        <div class="card card-kpi shadow-sm">
          <div class="card-body">
            <div class="text-secondary small">Deadline Hit Rate</div>
            <div class="stat" id="kpi-hit">—%</div>
            <canvas id="spark-hit" class="spark"></canvas>
          </div>
        </div>
      </div>
      <div class="col-6 col-lg-4">
        <div class="card card-kpi shadow-sm">
          <div class="card-body">
            <div class="text-secondary small">Avg Processing Time</div>
            <div class="stat" id="kpi-avg">— ms</div>
            <canvas id="spark-avg" class="spark"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4 mt-1">
      <div class="col-12 col-xl-6">
        <div class="card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-semibold">Online Nodes</span>
            <small class="text-secondary">Live</small>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-sm align-middle" id="nodes">
                <thead class="table-light">
                  <tr>
                    <th>Node</th>
                    <th class="text-end">Assigned Tasks</th>
                    <th class="text-end">CPU %</th>
                    <th class="text-end">Mem %</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div class="col-12 col-xl-6">
        <div class="card shadow-sm">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="fw-semibold">Task Averages by Type</span>
            <small class="text-secondary">Last window</small>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-sm align-middle" id="taskstats">
                <thead class="table-light">
                  <tr>
                    <th>Task</th>
                    <th class="text-end">Proccessing Time (ms)</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm mt-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span class="fw-semibold">Recent Jobs</span>
        <small class="text-secondary">Sample</small>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-sm align-middle" id="jobs">
            <thead class="table-light">
              <tr>
                <th>Task</th>
                <th>Node</th>
                <th class="text-end">Duration (ms)</th>
                <th>Created (UTC)</th>
                <th>Deadline</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const fmtNum = (n) => new Intl.NumberFormat().format(n);

    async function fetchJSON(url) {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    function buildSpark(el, labels, values) {
      new Chart(el.getContext('2d'), {
        type: 'line',
        data: { labels, datasets: [{ data: values, tension: 0.3, fill: false }] },
        options: { responsive: true, plugins: { legend: { display: false }, tooltip: { enabled: false } }, elements: { point: { radius: 0 } }, scales: { x: { display: false }, y: { display: false } } }
      });
    }

    async function loadDashboard() {
      const [overview, nodes, taskstats, table] = await Promise.all([
        fetchJSON('/api/overview?window=30'),
        fetchJSON('/api/nodes'),
        fetchJSON('/api/task_stats'),
        fetchJSON('/api/table?limit=60')
      ]);

      // KPIs
      document.getElementById('kpi-arrival').textContent = overview.latest_arrival_iso ?? '—';
      document.getElementById('kpi-hit').textContent = overview.deadline_hit_rate_pct + '%';
      document.getElementById('kpi-avg').textContent = fmtNum(overview.avg_processing_ms) + ' ms';
      buildSpark(document.getElementById('spark-arrival'), overview.arrivals.labels, overview.arrivals.values_ms);
      buildSpark(document.getElementById('spark-hit'), overview.hit_rate.labels, overview.hit_rate.values_pct);
      buildSpark(document.getElementById('spark-avg'), overview.avg_proc.labels, overview.avg_proc.values_ms);

      // Nodes table
      const nbody = document.querySelector('#nodes tbody');
      nbody.innerHTML = nodes.map(n => `
        <tr>
          <td><code>${n.node_id}</code></td>
          <td class="text-end">${fmtNum(n.tasks_assigned)}</td>
          <td class="text-end">${n.cpu_pct.toFixed(1)}</td>
          <td class="text-end">${n.mem_pct.toFixed(1)}</td>
        </tr>`).join('');

      // Task stats table
      const tsBody = document.querySelector('#taskstats tbody');
      tsBody.innerHTML = taskstats.map(t => `
        <tr>
          <td>${t.task_id}</td>
          <td class="text-end">${fmtNum(t.avg_processing_ms)}</td>
          <td><code>${t.node_id}</code></td>
        </tr>
      `).join('');

      // Recent jobs table
      const tbody = document.querySelector('#jobs tbody');
      const rows = table.rows;
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>${r.task_id}</td>
          <td><code>${r.node_id}</code></td>
          <td class="text-end">${fmtNum(r.duration_ms)}</td>
          <td><time datetime="${r.created_at}">${r.created_at}</time></td>
          <td>${r.deadline_hit ? '<span class="badge text-bg-success">Hit</span>' : '<span class="badge text-bg-danger">Miss</span>'}</td>
        </tr>`).join('');

      // simple filter
      const q = document.getElementById('q');
      q.addEventListener('input', () => {
        const needle = q.value.toLowerCase();
        for (const tr of tbody.querySelectorAll('tr')) {
          tr.style.display = tr.textContent.toLowerCase().includes(needle) ? '' : 'none';
        }
      }, { once: true });
    }

    document.getElementById('refresh').addEventListener('click', () => loadDashboard());
    loadDashboard().catch(err => console.error(err));
  </script>
</body>
</html>
