syntax = "proto3";
package edge;

message Header {
    int32 messageLength = 1;
    int32 commandID = 2;
}

message Task {
    int32 taskID = 1;
    bytes input = 2;
    bytes output = 3;
}

message Registration {
    bytes IP = 1;
    uint32 port = 2;
}

message Heartbeat {
    bytes IP = 1;
    uint32 port = 2;
}