syntax = "proto3";
package edge;

message Header {
    int32 messageLength = 1;
    int32 commandID = 2;
}

message Task {
    int32 taskID = 1;
    bytes input = 2;
    int32 deadline_ms = 3;
    int32 inputID = 4;
}

message Registration {
    bytes IP = 1;
    uint32 port = 2;
}

message Heartbeat {
    bytes IP = 1;
    uint32 port = 2;
}

message Response {
    bool success = 1;
    int32 code = 2;
    bytes value = 3;
}